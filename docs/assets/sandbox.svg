<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="824" viewBox="0 0 1340 824" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">A role session&#39;s sandbox</title>
        <desc id="archify-diagram-description">A role session, started with claude --agent &lt;type&gt; --bg and its own --settings, runs its shell commands inside the sandbox (bubblewrap on Linux), with no unsandboxed retry: its Bash writes only in its worktree, where it commits on its own branch, the run folder, the temp dir, the package caches and the main repository's .git, which its commits need, and reaches only the package hosts. Two guards run before a Read, Write or Edit call, never on a Bash call: guard-read.py on Read refuses a whole read of a file over 20,000 bytes; guard-records.py on Write and Edit keeps a record appended to, where only line 1, the STATUS line, and a brief's line-2 field (judge.md's VERDICT:, critique.md's Reviewed:) change. Its records are in the run folder (build-log.md, verify.md, its hand-over note) and scratch/&lt;role&gt;/. The protected paths in the worktree (.claude/settings.json, .claude/skills, .claude/hooks, .claude/agents, .claude/commands, .mcp.json, .git/hooks, .git/config) are closed to its shell and open to Write and Edit. The transcripts, the run's _control/ folder, docs/handoff/, the credentials file, /proc, ps, pgrep and claude agents, logs and attach are denied and hidden, so no role learns a model or an author. A refused step is one SANDBOX: line in its record, never a workaround, and a COPY-REQUEST:, CHECKOUT-REQUEST: or FF-REQUEST: line asks for a copy into the protected paths, a checkout or a fast-forward the same way. The records monitor wakes the manager chat, which runs outside the sandbox with four guards, supplies the path, host or material or does the copy, checkout or fast-forward, and answers below the line: SUPPLIED: to a SANDBOX: line, COPIED: to a COPY-REQUEST:, CHECKED-OUT: to a CHECKOUT-REQUEST:, FF-DONE: to an FF-REQUEST:, or REFUSED:; the sandbox is never weakened.</desc>
