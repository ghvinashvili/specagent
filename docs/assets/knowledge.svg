<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">The knowledge layer</title>
        <desc id="archify-diagram-description">A run's lessons become decision pages in wiki/ of the checkout. The wiki is compiled from the raw sources in context/. Ingesting a page writes its claims into the ledgers and refreshes wiki/hot.md. wiki/hot.md is injected into every session at its start. The code graph is rebuilt from the repository after each commit, and its layered articles are kept in wiki/graph/. A session asks the graph before it reads whole directories, so it reads hot.md, the index, the graph, then files. A decision for every project goes to your vault, which sessions read on need. A run's records and transcripts are measured into your vault. With your yes for one page, contribute.py refuses secrets, names and the other classes it lists. A page that passes goes to the public commons, which is not built yet. A session reads the commons as a source, never an authority: your vault wins.</desc>
