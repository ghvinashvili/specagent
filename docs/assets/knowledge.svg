.m-default{fill:#64748b}
.m-emphasis{fill:#34d399}
.m-security{fill:#fb7185}
.m-dashed{fill:#a78bfa}
.c-region{fill:rgba(251, 191, 36, 0.05);stroke:#fbbf24;stroke-dasharray:8,4}
</style>
