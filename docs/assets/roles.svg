<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="924" viewBox="0 0 1390 924" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">The roles and their records</title>
        <desc id="archify-diagram-description">When no spec exists, the spec-writer writes it in specs/ and the planner starts from it. The planner writes each task (plan-log.md) and answers the critic's C and A findings (critique-response.md); the critic reviews each task (critique.md); the watcher launches a plan fixer on demand when open ids pass a count or an age. Two builders take reviewed tasks (build-log-a.md, build-log-b.md); the verifier checks each commit (verify.md), sends V findings back to the builders and plan findings to the planner. The plan fixer answers the critic's open ids, the builders' B ids (wrong steps) and the verifier's (plan) and (spec) V ids, and edits the unbuilt tasks. It sends the fixed task files to the builders, and an answer line in critique-response.md to the critic and the verifier: the role that raised an id re-checks it and closes it. When every task is verified, a script starts the judge (judge.md). A blocker of the judge, with proof, goes back: its (code) blockers to the builders, its (plan) and (spec) blockers to the plan fixer; its majors and minors stay in judge.md for the owner. A blocker's fix is one commit, logged with its J id and sha; the verifier re-checks it like a V fix, the gate at the merge waits for that line, and the judge does not run again. The judge sends its verdict to the manager chat, which merges at the gate.</desc>
