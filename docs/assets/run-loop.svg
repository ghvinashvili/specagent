<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="794" viewBox="0 0 1320 794" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">The run loop</title>
        <desc id="archify-diagram-description">You give the manager chat a task and one yes. The manager writes the brief and the launch table and launches the role sessions, each in its own worktree and sandbox; when no spec exists, it launches the spec-writer first, which writes the spec in specs/ for them. The role sessions write their records into the run folder, the run's only state, which the gates check: code, a verifier and, at the end, one judge. A pass goes back to the manager, findings go back to the role sessions, and a judge's major or minor stays in judge.md for the owner. The role sessions write pages into the vault in the checkout and read it first. The manager gives you one branch.</desc>
