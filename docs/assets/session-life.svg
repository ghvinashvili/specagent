        <text x="72" y="100" class="t-dim" font-size="10" font-weight="600">01 / One session</text>
        <path d="M 72 264 L 908 264" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="252" class="t-dim" font-size="10" font-weight="600">02 / After its unit</text>
        <path d="M 72 436 L 908 436" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / The hand-over</text>

        <!-- Primary lifecycle rail -->
        <path d="M 154 157 L 748 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Transition paths -->
        <path d="M 153 157 L 189 157" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 307 157 L 343 157" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 461 157 L 497 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 615 157 L 651 157" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 710 188 L 710 278" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 630 307 L 566 307 Q 556 307 556 297 L 556 188" class="a-dashed" stroke-width="1.1" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 710 336 L 710 450" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 639 479 L 606 479" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 506 479 L 452 479" class="a-default" stroke-width="1.1" marker-end="url(#arrowhead)"/>
        <path d="M 352 479 L 26 479 Q 16 479 16 469 L 16 166.5 Q 16 157 25.5 157 L 35 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- States -->
        <g id="node-fresh" tabindex="0" role="button" aria-label="Focus fresh, a new session, One session" aria-pressed="false">
          <title>fresh · a new session · One session</title>
          <rect x="35" y="126" width="118" height="62" rx="7" class="c-mask"/>
          <rect x="35" y="126" width="118" height="62" rx="7" class="c-frontend" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(136 132) scale(0.6875)">
            <circle cx="8" cy="8" r="5"/>
            <path d="m7 5.4 3.6 2.6L7 10.6Z" class="sigil-fill"/>
          </g>
        <text x="45" y="140" class="t-frontend" font-size="7" font-weight="700">01</text>
          <text x="94" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">fresh</text>
          <text x="94" y="163" class="t-muted" font-size="7" text-anchor="middle">a new session</text>
        </g>

        <g id="node-reads" tabindex="0" role="button" aria-label="Focus brief, Read first, facts pack, note last, One session" aria-pressed="false">
