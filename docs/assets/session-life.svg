          </g>
        <text x="353" y="140" class="t-cloud" font-size="7" font-weight="700">03</text>
          <text x="402" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">waiter</text>
          <text x="402" y="163" class="t-muted" font-size="7" text-anchor="middle">wakes on input</text>
        </g>

