<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">A session&#39;s life</title>
        <desc id="archify-diagram-description">A fresh session reads its brief, the hand-over rule, the Read first section of lessons.md, the facts pack its brief names and, last, its hand-over note, then a waiter wakes it when its input is there. It does one unit, such as a task built, and leaves records: a commit and a STATUS: line. If the unit is not done and its context is under 200k, it goes on with the unit. When the unit is done it hands over by itself; when its context passes 200k the watcher stops it and resumes it once with the order to hand over. Either way it commits its work first, so that nothing is half done, then writes a hand-over note of at most 40 lines of facts, and the watcher starts a fresh session at the note. Only files pass between sessions.</desc>
<style>
svg{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans Mono CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace}
.c-grid{stroke:#1e293b;fill:none}
.c-mask{fill:#0f172a;stroke:none}
.c-frontend{fill:rgba(8, 51, 68, 0.4);stroke:#22d3ee}
.c-backend{fill:rgba(6, 78, 59, 0.4);stroke:#34d399}
.c-cloud{fill:rgba(120, 53, 15, 0.3);stroke:#fbbf24}
.c-security{fill:rgba(136, 19, 55, 0.4);stroke:#fb7185}
.c-external{fill:rgba(30, 41, 59, 0.5);stroke:#94a3b8}
.t-primary{fill:#ffffff}
.t-muted{fill:#94a3b8}
.t-dim{fill:#475569}
.t-frontend{fill:#22d3ee}
.t-backend{fill:#34d399}
.t-cloud{fill:#fbbf24}
.t-messagebus{fill:#fb923c}
svg .semantic-sigil{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:0.76}
svg .semantic-sigil > *{vector-effect:non-scaling-stroke}
svg .semantic-sigil .sigil-fill{fill:currentColor;stroke:none}
svg .s-frontend{color:#22d3ee}
svg .s-backend{color:#34d399}
svg .s-cloud{color:#fbbf24}
svg .s-external{color:#94a3b8}
.a-default{stroke:#64748b;fill:none}
.a-emphasis{stroke:#34d399;fill:none}
.a-dashed{stroke:#a78bfa;fill:none;stroke-dasharray:4,4}
.m-default{fill:#64748b}
.m-emphasis{fill:#34d399}
.m-security{fill:#fb7185}
.m-dashed{fill:#a78bfa}
</style>
<rect x="0" y="0" width="980" height="660" rx="16" fill="#020617"/>
<rect x="0" y="0" width="980" height="660" rx="16" fill="rgba(15, 23, 42, 0.5)"/>
