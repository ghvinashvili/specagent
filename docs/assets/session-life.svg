        <text x="507" y="140" class="t-backend" font-size="7" font-weight="700">04</text>
          <text x="556" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">one unit</text>
          <text x="556" y="163" class="t-muted" font-size="7" text-anchor="middle">e.g. a task built</text>
        </g>

        <g id="node-files" tabindex="0" role="button" aria-label="Focus records, commit, STATUS:, One session" aria-pressed="false">
