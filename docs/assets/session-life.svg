<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="614" viewBox="0 0 1320 614" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">A session&#39;s life</title>
        <desc id="archify-diagram-description">A fresh session reads its brief, the hand-over rule, the Read first section of lessons.md, the facts pack its brief names and, last, its hand-over note, then a waiter wakes it when its input is there. It does one unit, such as a task built, and leaves records: a commit and a STATUS: line. If the unit is not done and its context is under 200k, it goes on with the unit. When the unit is done it hands over by itself; when its context passes 200k the watcher stops it and resumes it once with the order to hand over. Either way it commits its work first, so that nothing is half done, then writes a hand-over note of at most 40 lines of facts, and the watcher starts a fresh session at the note. Only files pass between sessions.</desc>
<style>
