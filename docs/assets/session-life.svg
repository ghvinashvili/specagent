            <rect x="3" y="3" width="10" height="10" rx="2"/>
            <circle cx="8" cy="8" r="1.2" class="sigil-fill"/>
          </g>
          <text x="556" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">hand-over</text>
          <text x="556" y="487" class="t-muted" font-size="7" text-anchor="middle">40 lines of facts</text>
