            <path d="M2 8h3l1.5-3.5L9 12l1.6-4H14"/>
          </g>
        <text x="199" y="140" class="t-backend" font-size="7" font-weight="700">02</text>
          <text x="248" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">brief, Read first</text>
          <text x="248" y="163" class="t-muted" font-size="7" text-anchor="middle">facts pack, note last</text>
        </g>

        <g id="node-wait" tabindex="0" role="button" aria-label="Focus waiter, wakes on input, One session" aria-pressed="false">
          <title>waiter · wakes on input · One session</title>
          <rect x="343" y="126" width="118" height="62" rx="7" class="c-mask"/>
          <rect x="343" y="126" width="118" height="62" rx="7" class="c-cloud" stroke-width="1.5"/>
