          </g>
          <text x="402" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">watcher</text>
          <text x="402" y="487" class="t-muted" font-size="7" text-anchor="middle">starts the next</text>
        </g>

        <!-- Transition labels -->





        <g>
          <rect x="540" y="226.5" width="32" height="16" rx="4" class="c-mask"/>
          <text x="556" y="237.5" class="t-messagebus" font-size="8" text-anchor="middle">no</text>
        </g>
        <g>
          <rect x="694" y="385" width="32" height="16" rx="4" class="c-mask"/>
          <text x="710" y="396" class="t-muted" font-size="8" text-anchor="middle">yes</text>
        </g>




        <!-- Legend -->

      </svg>
