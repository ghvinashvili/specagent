# model and effort of a stage are exact: a run takes them as the table has them, whatever session creates it;
# `harness run --effort <stage>=<level>` changes one stage for one run (state.choose_stage, docs/decisions/0024).
version: 1
stages:
  - id: ingest
    role_type: librarian
    mode: bg
    model: opus
    effort: max
    inputs: [brief, context]
    output: output/changes.md
    gate: ingest
    approval: none
    permission_mode: acceptEdits
    max_minutes: 360
    max_attempts: 2

  - id: wikicheck
    role_type: verifier
    mode: bg
    model: opus
    effort: max
    depends_on: [ingest]
    inputs: [brief, "ingest:output/changes.md"]
    output: output/report.md
    gate: wikicheck
    approval: none
    permission_mode: acceptEdits
    max_minutes: 180
    max_attempts: 2

no_match:
  action: escalate
  message: "No role type matches this request. Answer with the name of an existing type from docs/generated/role-types.md, or create one with /new-role-type."
