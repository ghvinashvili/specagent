[project]
name = "harness"
version = "0.1.0"
description = "Launches, polls, resumes and gates Claude Code role sessions for a run"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "mcp>=2.2",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
