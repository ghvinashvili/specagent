schema_version: 1
name: pipeline-waiters
suite: regression
session: false   # graded by code on a copy of fixture/, with no model and no API key (ADR-0028)
trials: 1
fixture: fixture
# What this case proves: a sleep at a command position in a session's Bash commands and a waiter run otherwise than its brief
# gives it are found (acceptance check 10.19); the brief's own waiters, a sleep in quoted text and other tools are not. A
# brief's code span may cross a line end inside its paragraph (CommonMark 6.1), never a blank line or a fence; backticks
# inside a fenced block are its text, so a command shown only there is no waiter the brief gives.
graders:
  - type: python
    base: workspace
    script: evals/graders/pipeline_plan.py
    args: ["."]
pass_rule: deterministic_all
