name: Evals
on:
  pull_request:
    paths:
      - ".claude/**"
      - "plugins/**"
      - "templates/**"
      - "schemas/**"
      - "docs/roles/**"
      - "evals/**"
jobs:
  instruction-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync
      - run: uv run harness version-check --base origin/${{ github.base_ref }}
