name: Loops
on:
  schedule:
    - cron: "12 7 * * 1"
  workflow_dispatch:
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync
      - run: uv run harness loop validate
      - run: uv run harness loop tick --name context-audit
      - run: uv run harness loop tick --name wiki-lint
