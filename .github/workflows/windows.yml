name: Windows
# The README's Windows path: the repository runs in WSL2 (native Windows has no sandbox). GitHub's Windows runners
# start WSL2 (bubblewrap runs there), so this checks the tests, a new project made by the Quick start and its doctor,
# sandbox included, in Ubuntu under WSL2, as a user who is not root, on WSL's own file system as a user would clone
# it. Only in the public repository, where runners are free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  wsl:
    if: github.repository == 'ghvinashvili/specagent'
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3 python3-venv git curl ca-certificates bubblewrap socat
          wsl-shell-user: dev
      - run: whoami && test "$(id -u)" != 0
      - name: The checkout on WSL's own file system, as a user clones it there
        run: cp -a . ~/specagent && git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.281
      - run: cd ~/specagent && ~/.local/bin/uv python install 3.12 && ~/.local/bin/uv sync
      - run: cd ~/specagent && ~/.local/bin/uv run pytest -q
      - run: cd ~/specagent && ~/.local/bin/uv run harness validate
      - name: Make a new project (Quick start)
        id: new
        run: cd ~/specagent && PATH="$HOME/.local/bin:$PATH" python3 ops/new-project.py ~/demo repo_name=demo org=example --container
      - name: The new project's setup log
        if: failure() && steps.new.outcome == 'failure'
        run: cat ~/demo/demo/.claude/bootstrap.log
      - name: The new project's doctor
        run: |
          cd ~/demo/demo && git init -q && git config core.hooksPath .githooks
          PATH="$HOME/.local/bin:$PATH" uv run harness doctor
      - name: The new project validates
        run: cd ~/demo/demo && ~/.local/bin/uv run harness validate
